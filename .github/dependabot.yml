version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "sec(deps)"
    labels:
      - "dependencies"
      - "security"
    ignore:
      - dependency-name: "animejs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/animejs"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "ci"
      - "security"
